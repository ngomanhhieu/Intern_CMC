; Dia chi TCP cua tung tai khoan. Dat file nay CANH FILE .exe (thu muc Debug/Release).
; ip   : IP cua may dang chay tai khoan do (khi chay 2 may khac nhau, sua thanh IP that).
; port : cong ma tai khoan do lang nghe (moi tai khoan 1 cong khac nhau).
; App chi dung "port" cua chinh minh de lang nghe, va "ip"+"port" cua nguoi nhan de gui.
; Khong co file nay: mac dinh 127.0.0.1, cong 9000 (hieu) / 9001 (mai) / 9002 (nam).

[hieu]
ip=127.0.0.1
port=9000

[mai]
ip=127.0.0.1
port=9001

[nam]
ip=127.0.0.1
port=9002
